workflows:
  flutter-apk-build:
    name: Flutter Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Ensure Flutter Android configuration
        script: |
          if [ ! -d "android" ]; then
            flutter create . --force --platforms android --org com.example.cardgametracker
          fi
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/**/outputs/**/*.apk
